services:
  # PostgreSQL Database Service (Accessible ONLY via internal Docker network)
  postgres:
    image: postgres:16-alpine
    container_name: royalv_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-royal_v_properties}
    expose:
      - "5432"
    volumes:
      - royalv_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-royal_v_properties}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Web Application Service
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: royalv_web
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-postgres_secure_pass}@postgres:5432/${POSTGRES_DB:-royal_v_properties}?schema=public}
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_COOKIE_NAME=${AUTH_COOKIE_NAME:-royalv_session}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://royalv.varunyatech.in}
      - PORT=3000
    volumes:
      - royalv_uploads:/app/public/uploads
    ports:
      - "3000:3000"
    profiles:
      - full-stack

volumes:
  royalv_pgdata:
    driver: local
  royalv_uploads:
    driver: local
