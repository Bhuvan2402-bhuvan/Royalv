services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: royalv_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_royalv_pass
      POSTGRES_DB: royal_v_properties
    ports:
      - "5432:5432"
    volumes:
      - royalv_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d royal_v_properties"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Web Application (Optional containerized mode; for local dev, run 'npm run dev' locally)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: royalv_web
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres_royalv_pass@postgres:5432/royal_v_properties?schema=public
      - AUTH_SECRET=royalv_production_secure_secret_key_change_in_real_env_min_32_chars
      - AUTH_COOKIE_NAME=royalv_session
      - PORT=3000
    ports:
      - "3000:3000"
    profiles:
      - full-stack

volumes:
  royalv_pgdata:
    driver: local
